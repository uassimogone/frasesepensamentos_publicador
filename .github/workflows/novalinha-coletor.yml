name: 3 - Coletor Nova Linha Editorial

on:
  schedule:
    - cron: "0 10 * * *" # 07:00 em Brasília
  workflow_dispatch:
  push:
    paths:
      - "database/novalinha_trigger.txt"

jobs:
  coletar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Coletar carrossel do Telegram
        run: python src/novalinha_coletor.py
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TELEGRAM_CONTENT_CHAT_ID: ${{ secrets.TELEGRAM_CONTENT_CHAT_ID }}
      - name: Salvar fila
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/
          git diff --cached --quiet || git commit -m "chore: coletar carrossel nova linha"
          git pull --rebase origin main
          git push
