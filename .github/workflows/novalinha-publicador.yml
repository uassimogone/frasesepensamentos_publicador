name: 4 - Publicador Nova Linha Editorial

on:
  schedule:
    - cron: "0 10 * * *" # 07:00 em Brasília
    - cron: "0 21 * * *" # 18:00 em Brasília
  workflow_dispatch:

concurrency:
  group: novalinha-instagram-publisher
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Publicar próximo conteúdo final da fila
        run: python src/novalinha_publicador.py
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TEST_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TEST_TELEGRAM_CHAT_ID }}
          META_GRAPH_API_VERSION: "v25.0"
          META_GRAPH_API_HOST: "https://graph.facebook.com"

      - name: Persistir estado da fila
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/novalinha_posts.json
          git diff --cached --quiet || git commit -m "chore: atualizar fila nova linha editorial"
          git pull --rebase origin main
          git push
