name: 4 - Publicador Nova Linha Editorial

on:
  schedule:
    - cron: "0 12 * * *" # 09:00 em Brasília
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Publicar próximo carrossel aprovado
        run: python src/novalinha_publicador.py
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TEST_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TEST_TELEGRAM_CHAT_ID }}
          META_GRAPH_API_VERSION: "v25.0"
          META_GRAPH_API_HOST: "https://graph.facebook.com"
      - name: Persistir estado
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/
          git diff --cached --quiet || git commit -m "chore: registrar carrossel publicado"
          git pull --rebase origin main
          git push
