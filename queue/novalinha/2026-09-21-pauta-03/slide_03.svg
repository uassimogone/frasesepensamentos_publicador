<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#11171c"/>
    <stop offset="100%" stop-color="#07090b"/>
  </linearGradient>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="12"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0.035"/></feComponentTransfer>
  </filter>
</defs>
<rect width="1080" height="1350" fill="url(#bg)"/><rect width="1080" height="1350" filter="url(#grain)" opacity="0.5"/>
<g font-family="Arial, Helvetica, sans-serif" font-weight="800" fill="#F7F4EE">
  <text x="70" y="230" font-size="86">Menos horas</text>
  <text x="70" y="328" font-size="86">não resolvem</text>
  <text x="70" y="426" font-size="86">uma</text>
</g>
<rect x="290" y="352" width="660" height="105" fill="#C91F1F"/>
<text x="310" y="433" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="80" fill="#FFFFFF">empresa</text>
<rect x="62" y="468" width="910" height="108" fill="#C91F1F"/>
<text x="78" y="550" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="79" fill="#FFFFFF">desorganizada.</text>
<g font-family="Arial, Helvetica, sans-serif" font-size="45" fill="#F2EFE9">
  <text x="72" y="710">Sem método, tecnologia e liderança,</text>
  <text x="72" y="773">a conta vai aparecer em pressão,</text>
  <text x="72" y="836">estresse, atraso e custo financeiro</text>
  <text x="72" y="899">e humano.</text>
</g>
<text x="540" y="1284" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="3" fill="#F7F4EE" opacity="0.78">@uassimogone</text>
</svg>