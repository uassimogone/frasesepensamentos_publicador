<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#11171c"/>
    <stop offset="100%" stop-color="#07090b"/>
  </linearGradient>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="12"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0.035"/></feComponentTransfer>
  </filter>
</defs>
<rect width="1080" height="1350" fill="url(#bg)"/><rect width="1080" height="1350" filter="url(#grain)" opacity="0.5"/>
<g font-family="Arial, Helvetica, sans-serif" font-weight="800" fill="#F7F4EE">
  <text x="65" y="150" font-size="74">O debate sério exige</text>
</g>
<rect x="485" y="172" width="415" height="94" fill="#C91F1F"/>
<text x="505" y="244" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="70" fill="#FFFFFF">4 peças:</text>

<g font-family="Arial, Helvetica, sans-serif">
  <rect x="65" y="320" width="95" height="95" fill="#C91F1F"/><text x="112" y="389" text-anchor="middle" font-size="58" font-weight="800" fill="#fff">1</text>
  <text x="200" y="355" font-size="48" font-weight="800" fill="#F7F4EE">Produtividade:</text>
  <text x="200" y="405" font-size="36" fill="#E9E5DE">Fazer mais, com mais qualidade.</text>

  <line x1="65" y1="462" x2="1015" y2="462" stroke="#6D7377" stroke-width="2" opacity="0.55"/>
  <rect x="65" y="500" width="95" height="95" fill="#C91F1F"/><text x="112" y="569" text-anchor="middle" font-size="58" font-weight="800" fill="#fff">2</text>
  <text x="200" y="535" font-size="48" font-weight="800" fill="#F7F4EE">Custo:</text>
  <text x="200" y="585" font-size="36" fill="#E9E5DE">reduzir custo, para sustentar o negócio.</text>

  <line x1="65" y1="642" x2="1015" y2="642" stroke="#6D7377" stroke-width="2" opacity="0.55"/>
  <rect x="65" y="680" width="95" height="95" fill="#C91F1F"/><text x="112" y="749" text-anchor="middle" font-size="58" font-weight="800" fill="#fff">3</text>
  <text x="200" y="715" font-size="48" font-weight="800" fill="#F7F4EE">Tecnologia:</text>
  <text x="200" y="765" font-size="36" fill="#E9E5DE">é o que viabiliza a evolução.</text>

  <line x1="65" y1="822" x2="1015" y2="822" stroke="#6D7377" stroke-width="2" opacity="0.55"/>
  <rect x="65" y="860" width="95" height="95" fill="#C91F1F"/><text x="112" y="929" text-anchor="middle" font-size="58" font-weight="800" fill="#fff">4</text>
  <text x="200" y="895" font-size="48" font-weight="800" fill="#F7F4EE">Bem-estar:</text>
  <text x="200" y="945" font-size="36" fill="#E9E5DE">é o que mantém as pessoas no jogo.</text>

  <line x1="65" y1="1005" x2="1015" y2="1005" stroke="#6D7377" stroke-width="2" opacity="0.55"/>
  <text x="80" y="1072" font-size="31" fill="#F2EFE9">Se uma dessas peças sai da discussão, então a conta</text>
  <text x="80" y="1118" font-size="31" fill="#F2EFE9">vai aparecer em outro lugar.</text>
</g>
<text x="540" y="1284" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="3" fill="#F7F4EE" opacity="0.78">@uassimogone</text>
</svg>